<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Beautiful To-Do App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <div class="nav-bar">
        <a href="index.html" class="nav-link">Back to Tasks</a>
    </div>

    <div class="app-container settings-container">
        <header>
            <h1>Settings</h1>
            <p>Customize your experience</p>
        </header>

        <div class="settings-section">
            <h3>Display Name</h3>
            <div class="form-group">
                <input type="text" id="displayNameInput" placeholder="Enter your name">
                <button id="saveNameBtn" class="primary-btn">Save Name</button>
            </div>
            <div id="nameSuccess" class="success-message">Name updated successfully!</div>
        </div>

        <div class="settings-section">
            <h3>Data Management</h3>
            <button id="clearTasksBtn" class="danger-btn">Clear All Tasks</button>
            <div id="clearSuccess" class="success-message">All tasks cleared!</div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="settings.js"></script>
</body>
</html>
